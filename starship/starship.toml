[directory]
fish_style_pwd_dir_length = 1
truncation_length = 1

[custom.aws_sso_login]
when = "if (('~/.aws/sso/cache/d5439e9ace49ddb4a712c61d772b14f7320250e5.json' | path exists) and ((open ~/.aws/sso/cache/d5439e9ace49ddb4a712c61d772b14f7320250e5.json | get expiresAt | into datetime) - (date now)) > ('0sec' | into duration)) { exit 1 } else { exit 0 }"
description = "Check SSO Login is still valid"
symbol = "🚓 login to sso 🚓"
